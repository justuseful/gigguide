# Cloudflare's proxy IP ranges, so $remote_addr / logs show the real visitor IP
# (from the CF-Connecting-IP header) instead of Cloudflare's edge IP.
# https://www.cloudflare.com/ips/
real_ip_header CF-Connecting-IP;
real_ip_from 173.245.48.0/20;
real_ip_from 103.21.244.0/22;
real_ip_from 103.22.200.0/22;
real_ip_from 103.31.4.0/22;
real_ip_from 141.101.64.0/18;
real_ip_from 108.162.192.0/18;
real_ip_from 190.93.240.0/20;
real_ip_from 188.114.96.0/20;
real_ip_from 197.234.240.0/22;
real_ip_from 198.41.128.0/17;
real_ip_from 162.158.0.0/15;
real_ip_from 104.16.0.0/13;
real_ip_from 104.24.0.0/14;
real_ip_from 172.64.0.0/13;
real_ip_from 131.0.72.0/22;
real_ip_from 2400:cb00::/32;
real_ip_from 2606:4700::/32;
real_ip_from 2803:f800::/32;
real_ip_from 2405:b500::/32;
real_ip_from 2405:8100::/32;
real_ip_from 2a06:98c0::/29;
real_ip_from 2c0f:f248::/32;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    client_max_body_size 6m;

    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /static/ {
        alias /opt/gigguide/app/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        alias /var/lib/gigguide/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
