<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.SITE_NAME }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.SITE_TAGLINE }}{% endblock %}">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('public.index') }}">{{ config.SITE_NAME }}</a>
    <nav>
      <a href="{{ url_for('public.index') }}">Gigs</a>
      <a href="{{ url_for('public.stories') }}">Stories</a>
      <a href="{{ url_for('public.venues') }}">Venues</a>
      <a href="{{ url_for('public.performers') }}">Performers</a>
      <a href="{{ url_for('public.support') }}">Support</a>
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="flash flash--{{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    {{ config.SITE_NAME }} &middot; {{ config.SITE_TAGLINE }}
  </footer>
  <script src="{{ static_url('app.js') }}" defer></script>
</body>
</html>
