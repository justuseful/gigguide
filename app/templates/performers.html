{% extends "base.html" %}
{% block title %}Performers &ndash; {{ config.SITE_NAME }}{% endblock %}
{% block content %}
<section class="hero">
  <h1>Performers</h1>
  <p>Find one of {{ count }} act{{ "s" if count != 1 else "" }} by name.</p>
</section>
{% if options %}
<div class="combobox" data-combobox="single" data-navigate="1">
  <input type="text" class="combobox__input" autocomplete="off" placeholder="Start typing a performer name&hellip;">
  <ul class="combobox__list" role="listbox" hidden></ul>
  <div class="combobox__hidden"></div>
  <script type="application/json" class="combobox__options">{{ options|tojson }}</script>
  <script type="application/json" class="combobox__selected">[]</script>
</div>
{% else %}
<p class="empty">No performers yet.</p>
{% endif %}
{% endblock %}
